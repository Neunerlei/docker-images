# Scenario: legacy-exact-command-multiline — §3.2 case 2: a single string
# argument containing a NEWLINE (the $'...' ANSI-C form survives the
# scenario.conf eval and produces one argument with an embedded newline).
#
# The fallback splits on ALL whitespace including newlines (read -r -d ''
# consumes the whole string — the bug where content after the first line was
# silently dropped was fixed on this branch). Observable: echo receives THREE
# arguments (echo, a, b) and prints "a b"; the same output on main (main's
# unquoted exec word-splits on newlines too), plus the deprecation warnings
# on the branch.

images=nginx
modes=static

command-mode=container
command=$'echo a\nb'

# Legacy-layer coverage: exact-command-arguments (single-string fallback)
legacy-layer=2026-11-12-exact-command-arguments.sh

http-probe=/
