# Scenario: env-file-upload-size — MAX_UPLOAD_SIZE from a custom env file
# reaches the DERIVED upload variables (the core fix of the environment
# pipeline reordering, docs/migration/2026-11-17-environment-pipeline.md).
#
# Before the reordering, every derived value was computed from the defaults
# forever: a .env with MAX_UPLOAD_SIZE=500M left MAX_UPLOAD_SIZE_BYTES at
# 104857600 and NGINX_CLIENT_MAX_BODY_SIZE at 100M. The pipeline derives
# again after the .env pass, so now:
#   - nginx: client_max_body_size 500M renders into the live config;
#   - php-nginx: upload_max_filesize / post_max_size follow in the rendered
#     php ini (image-config section in the golden);
#   - the byte form is the exact 500M value.
#
# The values are asserted live in Tier 3 (nginx -T, rendered ini, exported
# vars through the wrapped bash); the golden pins the rendered files.

# php-nginx and node-nginx render client_max_body_size in their web-mode
# root location — the plain nginx image renders it in PROXY mode only, which
# is its own scenario (env-file-upload-size-proxy).

images=php-nginx node-nginx
modes=static live

http-probe=/
