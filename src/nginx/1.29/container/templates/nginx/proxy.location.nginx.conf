# This block is for the ${PROXY_UPSTREAM_HOST} service
location ${PROXY_LOCATION_PATH} {
    set $upstream ${PROXY_UPSTREAM_PROTOCOL}://${PROXY_UPSTREAM_HOST}:${PROXY_UPSTREAM_PORT};
    proxy_pass $upstream;

    ${PROXY_REWRITE_RULE}

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Original-URI $request_uri;

    # Timeouts
    proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
    proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};
    proxy_send_timeout ${NGINX_PROXY_SEND_TIMEOUT};

    # Allow per-location custom snippets. The dot after the key is the key boundary —
    # without it, keys sharing a prefix (e.g. "api" and "api_v2") would include each
    # other's snippets — and the "conf" ending keeps unrelated files (e.g. a
    # "rag.configuration.txt") out. Snippets named exactly "<key>.conf" keep working.
    # The generated basic auth snippet for this service (<key>.auth.conf, see
    # _configure_proxy_basic_auth) is picked up here as well.
    include ${NGINX_CUSTOM_SNIPPETS_PROXY_DIR}/${KEY_LOWER}.*conf;
}
