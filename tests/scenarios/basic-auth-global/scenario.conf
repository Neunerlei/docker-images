# Scenario: basic-auth-global — global basic auth via the documented
# NGINX_BASIC_AUTH / NGINX_BASIC_AUTH_<n> / NGINX_BASIC_AUTH_REALM variables
# (docs/nginx.md, "Basic Authentication"; implemented in step.d/020-nginx.sh
# with util.d/basic-auth.sh).
#
# Two users exercise the multi-user collection path (numeric _1..n order).
# The generated htpasswd hashes are salted and differ on every boot — they
# are normalized in lib/normalize.sed, which is exactly why this scenario is
# part of checkpoint 1. That the passwords actually WORK is asserted in
# Tier 1/3 with openssl passwd, never in the golden.

images=nginx
modes=static live

# Live: the protected document root must answer 401 with the realm header
# when no credentials are sent — that response IS the observable behavior.
http-probe=/

# (scenario.conf may carry a legacy-layer=<file name> tag for legacy coverage;
# none here — this is a current-behavior scenario.)
