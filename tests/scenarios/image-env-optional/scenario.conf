# Scenario: image-env-optional — an image WITHOUT container/entrypoint/
# image-env.sh boots (the file convention is optional).
#
# The scenario image DELETES image-env.sh from the base image: the
# orchestrator's declare -F guards must tolerate its absence (no mode, no
# features, no image defaults — the common defaults from derive_common_env
# carry the boot). The entrypoint completes and execs the command; nothing
# nginx/supervisor-specific runs (the features were never registered).

images=nginx
modes=static

# Build-time scenario: the derived image (Dockerfile) is captured/booted.
dockerfile=Dockerfile

# The probe IS the container command: the entrypoint runs all steps and
# execs it — its exit code proves the pipeline completed without the file.
command=/bin/true
