# Scenario: env-file-explicit-precedence — an explicit NGINX_CLIENT_MAX_BODY_SIZE
# beats a .env MAX_UPLOAD_SIZE (tracked defaults, util.d/default-var.sh).
#
# MAX_UPLOAD_SIZE is an INPUT (its default is recomputed, 500M applies), and
# NGINX_CLIENT_MAX_BODY_SIZE is derived from it — unless the user set it
# explicitly. Both values in the SAME .env: the explicit 50M must win over
# the derived 500M. This is the default_var contract end to end: the
# user-set value was never recorded by the tracker, so no derive pass
# touches it.

# php-nginx renders client_max_body_size in its web-mode root location (the
# plain nginx image renders it in proxy mode only — env-file-upload-size-proxy
# covers that half), so this runs on php-nginx and observes BOTH the nginx
# directive and the explicit user override surviving the derived default.

images=php-nginx
modes=static live

http-probe=/
