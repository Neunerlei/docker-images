# Scenario: puid-pgid-read-only — PUID/PGID on a read-only root filesystem
# aborts the boot cleanly (docs/common.md, "Read-only filesystems").
#
# STATIC ONLY: with a non-default PUID/PGID the user remap must rewrite
# /etc/passwd and /etc/group (usermod/groupmod, plus their lock files next to
# them) — impossible on a read-only root. Silently continuing would boot with
# the DEFAULT uid/gid 33 while every user-owned file is remapped for the
# REQUESTED ids, so step 060 checks /etc writability and aborts with a named
# error BEFORE any usermod/groupmod runs.
#
# The mount set is the documented read-only set (the read-only-filesystem
# scenario): --read-only, the runtime directories as tmpfs, and an anonymous
# tmpfs at /container/work (starts empty — the documented tmpfs/emptyDir
# case). PUID/PGID=1000 deliberately differs from the built-in 33/33: the
# "already correct" 33/33 request needs no write at all and keeps booting on
# read-only roots (that case is covered by the read-only-filesystem scenario
# without PUID/PGID and by puid-pgid-user-dirs on writable roots).
#
# Expected relation to main: main has no guard — usermod/groupmod die on the
# read-only /etc with their raw lock error. The clean abort is branch
# behavior; any OTHER outcome here (silent continue, crash-loop) is a finding.

images=nginx
modes=static
