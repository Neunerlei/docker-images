# Scenario: legacy-build-mode-boot — the LEGACY no-command build mode
# (RUN /container/entrypoint/entrypoint.sh without a command) and a later
# build step, then booting the result.
#
# §3.2 "build-mode-marker-and-variables", boot surface: the derived image must
# stay BOOTABLE (no marker is written by the legacy invocation), the boot must
# reset the work data cleanly, and the boot-reset scope difference shows on
# the later-RUN marker: branch keeps it (reset = work/data only), main loses
# it (clean-state snapshot already taken during the build-mode run, reset =
# whole work dir) — see the Dockerfile comment; expected diffs #1/#13.
#
# The branch additionally logs the build-mode deprecation warning — during the
# BUILD, not the boot; legacy-build-mode-run-env captures it.
#
# node-nginx only: build mode requires an image whose 015-image-vars step
# respects CONTAINER_MODE=build (php/node/python do; the NGINX image
# deliberately overrides the mode to static/proxy — its 015 comment: "There
# is no build-time configuration for nginx images" — so on nginx this RUN
# would silently degrade to a normal boot and exercise nothing). plan §5
# lists node-nginx as the build-mode carrier; php-nginx runs the same
# mechanism via the init-build-env scenarios.

images=node-nginx
modes=static

# The scenario Dockerfile (legacy build-mode invocation + later RUN step) is
# built ON TOP of the image under test before the capture (plan §2.3).
dockerfile=Dockerfile

# Legacy-layer coverage: build mode marker and variables (deprecated no-command build mode)
legacy-layer=2026-11-12-build-mode-marker-and-variables.sh

http-probe=/
