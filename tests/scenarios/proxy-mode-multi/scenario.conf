# Scenario: proxy-mode-multi — proxy mode with several proxied services,
# including a custom per-service snippet named exactly "<key>.conf" (the
# legacy snippet naming) mounted via files/ + docker-args.
#
# docs/nginx.md, "Proxy Mode In-Depth" + "1.2 Per-Service Snippets": any
# PROXY_<KEY>_CONTAINER variable turns the image into a reverse proxy; a
# snippet in custom/nginx/proxy/<key>.conf is included into that service's
# location block. The legacy name (no purpose part after the key dot) is the
# §3.2 "proxy snippet naming" case: the branch tightened the include glob from
# "<key>*.conf" to "<key>.*conf" — "<key>.conf" matches BOTH, so the relation
# to main is "still included" (observable in nginx-T.conf, which dumps the
# fully resolved config including the snippet body).
#
# The upstream hosts are deliberately nonexistent: proxy_pass uses a $variable
# (dynamic upstream), so the boot succeeds without DNS and a request fails
# 502 at request time — deterministic on both sides. "api" and "api_v2" share
# a key prefix on purpose: the dot boundary must keep api_v2's snippets out of
# the api location (main's glob would have included them).

images=nginx
modes=static live

# / -> frontend location (no snippet, no auth), /api -> api location (the
# legacy-named snippet must appear in the rendered config)
http-probe=/
http-probe=/api/
http-probe=/api_v2/
