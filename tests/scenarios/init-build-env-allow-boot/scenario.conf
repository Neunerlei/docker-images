# Scenario: init-build-env-allow-boot — `RUN init-build-env --allow-boot`
# plus a later `RUN` step, then booting the result (docs/common.md, "Build
# Mode" / "CI").
#
# --allow-boot runs the same build mode WITHOUT the marker, so the image stays
# bootable; the work data is synced back into the staging area, so changes
# made by later build steps SURVIVE boots. Two observables in one capture:
#   - the boot succeeds (no marker abort) and logs no deprecation warning;
#   - build-step-marker — written by a SEPARATE `RUN` after the build-mode run
#     (the "run build commands in a separate RUN" rule) — must appear in the
#     work-data checksums and the /container ownership listing after the boot:
#     it survived the work-data reset via the staging sync.
#
# Parity note: main has no init-build-env — the scenario build fails there by
# design (expected build failure in the report).

images=php-nginx node-nginx
modes=static

# The scenario Dockerfile (RUN init-build-env --allow-boot + later RUN step)
# is built ON TOP of the image under test before the capture (plan §2.3).
dockerfile=Dockerfile

http-probe=/
