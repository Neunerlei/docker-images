# Scenario: env-file-node-web-command — a NODE_WEB_COMMAND that exists only
# in a custom env file satisfies web mode (environment pipeline reordering,
# docs/migration/2026-11-17-environment-pipeline.md).
#
# Before: node's "web mode requires NODE_WEB_COMMAND or server.js" check ran
# in the old 015-image-vars step, BEFORE the env files loaded — a .env
# command did not exist yet, and without a server.js the boot aborted. The
# check now runs in image_env_validate(), after all env files loaded (the
# server.js probe lives in image_env_defaults() and is tracked, so the .env
# value beats it).
#
# server.js is hidden by mounting an EMPTY TMPFS over /var/www/html, so the
# only command source is the .env file. Deliberately tmpfs, NOT a bind mount
# of an empty fixture directory: /var/www/html is a user-owned-directories
# registry entry, so step 070 chowns the mount — through a bind mount that
# chown lands on the REPO fixture (mutating the tree, differently on every
# checkout) and the host's file modes leak into ownership.txt. A tmpfs starts
# empty and root-owned on every machine; the chown target is throwaway. The
# command idles (deterministic web stack: nginx answers 502 on / — any status
# passes the readiness gate).

images=node-nginx
modes=static live

http-probe=/
