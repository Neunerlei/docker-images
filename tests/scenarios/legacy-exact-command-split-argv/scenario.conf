# Scenario: legacy-exact-command-split-argv — §3.2 case 4: a properly split
# argv (`echo`, `a`, `b` as three arguments).
#
# The control case: no fallback may trigger, no deprecation warning may
# appear, and the boot log line reports the quoted argv
# ("starting command \"echo a b \""). Expected relation to main: IDENTICAL
# output ("a b") and exit code; only the boot-log quoting of the argv differs
# (printf '%q' on the branch vs raw string on main — expected diff #10).

images=nginx
modes=static

command-mode=container
command=echo a b

# Legacy-layer coverage: exact-command-arguments (single-string fallback)
legacy-layer=2026-11-12-exact-command-arguments.sh

http-probe=/
