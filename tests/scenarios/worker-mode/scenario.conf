# Scenario: worker-mode — <RUNTIME>_WORKER_COMMAND (single string in env)
# (docs/common.md, "Worker Mode"; per-image variable in the image docs).
#
# Setting the worker command flips the image to worker mode: the web stack
# (nginx + php-fpm/gunicorn/node-server) is disabled and supervisor runs
# `gosu www-data <COMMAND>` instead. The command is passed as ONE string in
# the environment — supervisor interprets it with a shell, so this never
# touches the entrypoint's argv handling (that distinction is exactly why the
# HAWKI-RAG consumer row watches it, plan §3.3).
#
# The worker command prints its HOME and an argv marker once, then idles —
# deterministic output in the live logs, and the worker HOME is the §6
# observable (gosu derives it from the passwd entry). wait-http=false: no web
# server exists in worker mode, so the HTTP readiness gate is skipped (the
# supervisor RUNNING gate is the readiness signal); the probe's default "/"
# request then records "!! request failed" — the honest worker-mode shape.

images=php-nginx python-nginx node-nginx
modes=static live

wait-http=false
