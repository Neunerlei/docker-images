# Scenario: env-file-node-web-command — a NODE_WEB_COMMAND that exists only
# in a custom env file satisfies web mode (environment pipeline reordering,
# docs/migration/2026-11-17-environment-pipeline.md).
#
# Before: node's "web mode requires NODE_WEB_COMMAND or server.js" check ran
# in the old 015-image-vars step, BEFORE the env files loaded — a .env
# command did not exist yet, and without a server.js the boot aborted. The
# check now runs in image_env_validate(), after all env files loaded (the
# server.js probe lives in image_env_defaults() and is tracked, so the .env
# value beats it).
#
# server.js is hidden by mounting an EMPTY directory over /var/www/html, so
# the only command source is the .env file. The command idles (deterministic
# web stack: nginx answers 502 on / — any status passes the readiness gate).

images=node-nginx
modes=static live

http-probe=/
