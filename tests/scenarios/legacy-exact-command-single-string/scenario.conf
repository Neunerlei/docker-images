# Scenario: legacy-exact-command-single-string — §3.2 "exact-command-arguments"
# case 1: the whole command line passed as ONE string argument containing
# double spaces ("echo a  b").
#
# Harness note: the default capture execs the probe as the container command,
# and the probe path is executable — the legacy fallback
# (legacy_apply_single_string_command_fallback) can never trigger for it. That
# is why this scenario uses command-mode=container: the command under test IS
# the container command; the capture is the boot log + the command's own
# stdout/stderr/exit code, which is precisely the observable here.
#
# Expected relation to main: SAME behavior (both word-split the string, echo
# joins its arguments with single spaces -> "a b") PLUS the branch's two
# deprecation warning lines + migration-guide link on stderr (intended).

images=nginx
modes=static

command-mode=container
command='echo a  b'

# Legacy-layer coverage: exact-command-arguments (single-string fallback)
legacy-layer=2026-11-12-exact-command-arguments.sh

http-probe=/
