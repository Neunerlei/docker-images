server {
    listen 80 default_server;
    server_name _;

    # Optional basic auth (NGINX_BASIC_AUTH), applies to the whole server
    ${NGINX_BASIC_AUTH_BLOCK}

    include ${NGINX_SNIPPETS_DIR}/resolver.nginx.conf;
    include ${NGINX_SNIPPETS_DIR}/root.nginx.conf;
    include ${NGINX_SNIPPETS_DIR}/errors.nginx.conf;
    include ${NGINX_CUSTOM_SNIPPETS_DIR}/*.conf;
}
