# Scenario: resolver-multi-nameserver — a /etc/resolv.conf with MULTIPLE
# nameservers (docs/common.md, "NGINX DNS Resolution").
#
# docker-args pins two --dns addresses, so Docker writes both into the
# container's resolv.conf — the resolver detection must collect ALL of them
# space-separated (multi-nameserver detection, including the no-trailing-
# newline robustness of the parser) and render the full LIST into the nginx
# resolver directive ("resolver 192.0.2.10 192.0.2.11 valid=30s;").
#
# The addresses come from RFC 5737 TEST-NET (never routed, never queried —
# nothing in this scenario resolves a dynamic upstream), so the golden is
# machine-independent by construction. The normalizer still collapses the
# whole LIST (see lib/normalize.sed — its resolver entries match space-
# separated lists since multi-address values became a real case), which this
# golden verifies: the normalized placeholder must appear where the LIST
# rendered, while the surrounding snippet text and knobs stay visible.

images=nginx
modes=static live

http-probe=/
