# Scenario: registry-installer-user-dirs — the installer's --user-owned-dir
# registrations survive the user_owned_directories_registry move from
# entrypoint.sh into step 070 (environment pipeline reordering,
# docs/migration/2026-11-17-environment-pipeline.md).
#
# The registry used to be REASSIGNED in entrypoint.sh with the static
# entries; the installer-registry.sh additions (python-nginx: /opt/venv via
# the venv pattern; node-nginx: /usr/local/lib/node_modules) landed AFTER
# that assignment, before the steps ran. The move must PREPEND the static
# entries in step 070 — a plain reassignment there would drop these.
#
# A plain ownership assert could NOT fail before this became a build-time
# scenario: node-nginx's Dockerfile already chowns node_modules at build
# time, so even a lost registry entry left the ownership looking correct.
# The scenario Dockerfile therefore breaks the ownership (chown root) on
# TOP of the image — only step 070's registry-driven repair can restore it.

images=python-nginx node-nginx
modes=static live

# Build-time scenario: the derived image (Dockerfile) is captured/booted.
dockerfile=Dockerfile

http-probe=/
