# Scenario: init-build-env-double-run — repeated build-mode runs keep working
# and changes made between them survive (docs/common.md, "Build Mode").
#
# Dockerfile chain (built ON TOP of the image under test):
#   RUN init-build-env                                  (1st run, writes the marker)
#   RUN touch /container/work/data/double-run-marker    (later build step)
#   RUN init-build-env --allow-boot                     (2nd run)
#   RUN test -f /container/work/data/double-run-marker  (build-time assertion)
#
# Why the second run is --allow-boot: a PLAIN second run leaves the marker in
# the layer by design (the image stays a builder stage) and a boot of it
# refuses — that refusal is already pinned by init-build-env-refuses-boot.
# Here the observable under test is the DATA flow: the marker written between
# two build-mode runs must survive BOTH the second run and the boot (work-data
# checksums + the live container), which needs a bootable image — exactly what
# --allow-boot produces (and while at it, proves --allow-boot removes an
# earlier marker: the boot below is NOT refused).
#
# The plain-run sync-back fix is what makes the chain work: the first run
# ends by syncing work/data into staging and restoring the build-time
# symlink, so the `touch` writes through to STAGING; the second run re-renders
# from it and syncs back again. Without the sync, the touch would land in a
# stale real work-data copy and the last RUN (and the boot) would fail.
#
# Where the assertions live: the Dockerfile's final `RUN test -f` proves the
# marker survived the second build-mode run (a regression fails the SCENARIO
# BUILD, red in the golden tier). The static golden proves boot survival: the
# marker is in the boot-reset work data (work-data.checksums) and the boot is
# not refused (exit-code 0). The integration tier (expect.bats) boots the
# DERIVED scenario image (dockerfile= is honored there — same
# nl_build_scenario_image build as this tier) and asserts the marker inside
# the RUNNING container: the golden's checksum list proves the file exists in
# the recorded filesystem state, the live test proves it survives an actual
# boot (work data is reset from staging on every boot) and is reachable in
# the container the consumer would ship.

images=php-nginx
modes=static

# The scenario Dockerfile above is built ON TOP of the image under test.
dockerfile=Dockerfile

http-probe=/
