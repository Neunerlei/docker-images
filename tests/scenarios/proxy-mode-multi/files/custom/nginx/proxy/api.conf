# Custom per-service snippet named exactly "<key>.conf" — the LEGACY naming
# convention (docs/nginx.md 1.2: "Snippets named exactly api.conf (without a
# purpose part) keep working for backward compatibility"). The name matches
# both the old "<key>*.conf" and the current "<key>.*conf" glob, so the
# legacy bridge does not touch it: the normal render includes it and no
# warning fires. The body must appear inside the /api location in nginx -T.
add_header X-Nl-Test-Snippet "api.conf included" always;
