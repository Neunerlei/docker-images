# configuration file /etc/nginx/snippets/default.nginx.conf:
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/basicAuth.nginx.conf;
    include /etc/nginx/snippets/resolver.nginx.conf;
    include /etc/nginx/snippets/root.nginx.conf;
    include /etc/nginx/snippets/errors.nginx.conf;
    include /etc/nginx/snippets/custom.d/*.conf;
}

# configuration file /etc/nginx/snippets/basicAuth.nginx.conf:
# basic auth is not configured

# configuration file /etc/nginx/snippets/resolver.nginx.conf:
# Name servers used by Nginx to resolve dynamic upstream names (a variable in
# proxy_pass, "server ... resolve", ...). Those are resolved on every request —
# Nginx never reads /etc/resolv.conf for them on its own.
#
# The default is detected from /etc/resolv.conf when the container boots:
#   Docker (user-defined networks) -> 127.0.0.11 (the embedded Docker DNS)
#   Kubernetes                     -> the cluster DNS
#   Podman / host networking       -> the runtime or host resolvers
# Override with NGINX_RESOLVER (space-separated list for multiple servers).
#
# NOTE: Nginx's resolver does not apply the "search" / "ndots" options from
# resolv.conf. In Kubernetes, use fully qualified service names
# (service.namespace.svc.cluster.local) for variable-based upstreams.
resolver <NL-TEST-RESOLVER> valid=30s;
resolver_timeout 5s;

# configuration file /etc/nginx/snippets/root.nginx.conf:
sendfile off;
tcp_nodelay on;
absolute_redirect off;
client_max_body_size 100M;

root /var/www/html/public;
index index.php index.html;

location / {
    # First attempt to serve request as file, then
    # as directory, then fall back to index.php
    try_files $uri $uri/ /index.php$is_args$args; # Default: $uri $uri/ /index.php$is_args$args | See image-vars.sh
    include /etc/nginx/snippets/location.d/*.conf;
}

# Pass the PHP scripts to PHP-FPM listening on php-fpm.sock
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/run/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_index index.php;
    fastcgi_connect_timeout 5s;
    fastcgi_send_timeout 60s;
    fastcgi_read_timeout 60s;
    include fastcgi_params;
}

# Allow fpm ping and status from localhost
location ~ ^/(fpm-status|fpm-ping)$ {
    access_log off;
    allow 127.0.0.1;
    deny all;
    # Unconditional opt-out from the generated global basic auth (NGINX_BASIC_AUTH):
    # health checks and orchestrator probes cannot send credentials, and with no
    # global auth configured the directive is inert
    auth_basic off;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_pass unix:/run/php-fpm.sock;
}

# configuration file /etc/nginx/fastcgi_params:

fastcgi_param  QUERY_STRING       $query_string;
fastcgi_param  REQUEST_METHOD     $request_method;
fastcgi_param  CONTENT_TYPE       $content_type;
fastcgi_param  CONTENT_LENGTH     $content_length;

fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
fastcgi_param  REQUEST_URI        $request_uri;
fastcgi_param  DOCUMENT_URI       $document_uri;
fastcgi_param  DOCUMENT_ROOT      $document_root;
fastcgi_param  SERVER_PROTOCOL    $server_protocol;
fastcgi_param  REQUEST_SCHEME     $scheme;
fastcgi_param  HTTPS              $https if_not_empty;

fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;

fastcgi_param  REMOTE_ADDR        $remote_addr;
fastcgi_param  REMOTE_PORT        $remote_port;
fastcgi_param  REMOTE_USER        $remote_user;
fastcgi_param  SERVER_ADDR        $server_addr;
fastcgi_param  SERVER_PORT        $server_port;
fastcgi_param  SERVER_NAME        $server_name;

# PHP only, required if PHP was built with --enable-force-cgi-redirect
fastcgi_param  REDIRECT_STATUS    200;

# !!! Security workaround !!!
# Do not use HTTP_HOST as "$http_host".
#
# "$http_host" is the Host header exactly as supplied by the client.
# This is unsafe when a client sends an absolute-form request target together
# with a different Host header, for example:
#
#     GET https://example.com/ HTTP/1.1
#     Host: malformedhost
#
# In such a case, passing "$http_host" upstream exposes the raw client-supplied
# Host value ("malformedhost") to the backend application, even though it does
# not match the effective request target. Applications often use HTTP_HOST for
# redirects, absolute URL generation, virtual host routing, or security checks;
# forwarding the raw Host header can therefore lead to incorrect or unsafe
# behaviour.
#
# Newer nginx versions (since 1.30.0) introduce variables "$is_request_port" and
# "$request_port", allowing HTTP_HOST to be constructed as:
#     $host$is_request_port$request_port
#
# In stable/oldstable packages we use "$host" as a security workaround.
# It avoids forwarding an untrusted raw Host header to the backend.
#
# Note: this changes behaviour compared to previous versions, because "$host"
# does not preserve the client-supplied port, while "$http_host" typically
# does. Existing deployments that rely on "$http_host" containing a port number
# may therefore break or behave differently after this change.

fastcgi_param  HTTP_HOST        $host;

# configuration file /etc/nginx/snippets/errors.nginx.conf:
error_page 400 401 403 404 500 502 503 504 @error_handler;

location @error_handler {
    internal;
    # Keep the error pages reachable when basic auth is enabled on the server,
    # so failed logins still get the custom error page instead of a bare 401
    auth_basic off;
    root /var/www/errors;
    try_files /${status}.${error_file_ext} /${status}.html /500.html =500;
}

