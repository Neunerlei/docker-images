# Scenario: resolver-autodetect — the auto-detected NGINX resolver with
# non-default valid=/timeout knobs (docs/common.md, "NGINX DNS Resolution").
#
# NGINX_RESOLVER is deliberately NOT set: the entrypoint detects the
# nameservers from /etc/resolv.conf on every boot (common-env.sh
# detect_dns_resolvers). The ADDRESS is environment-dependent and therefore
# normalized in lib/normalize.sed — what this scenario pins is that the
# detected value renders AT ALL (directive present, variables exported) and
# that the knob overrides reach the directive: valid=17s, resolver_timeout 9s
# (non-default values stay fully visible in nginx-T.conf).

images=nginx
modes=static live

http-probe=/
