# Scenario: env-file-https — DOCKER_PROJECT_PROTOCOL=https from a custom env
# file now really renders the HTTPS configuration (environment pipeline
# reordering, docs/migration/2026-11-17-environment-pipeline.md).
#
# Before: DOCKER_SERVICE_PROTOCOL was derived from the project protocol
# BEFORE the env files loaded and then never again, so an env-file https
# stayed http internally — no 443 listen, no redirect. Now the second derive
# pass propagates it: nginx listens on 443 with self-signed certs (none
# mounted) and redirects 80 → 301 https, exactly like the
# https-direct-selfsigned scenario does via docker -e.

images=nginx
modes=static live

http-probe=/
