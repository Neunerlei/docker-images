# Scenario: puid-pgid-user-dirs — PUID/PGID change plus USER_OWNED_DIRECTORIES
# (docs/nginx.md table; implemented in step.d/060-user-setup.sh and 070).
#
# www-data is re-mapped to uid 10000 / gid 10001 at boot (matching host file
# permissions is the documented use case), and /data — a directory the
# application writes into that does not exist in the image — is created and
# chowned via USER_OWNED_DIRECTORIES. The observables: the passwd entry
# (uid/gid), the boot log lines of the user-setup and user-permissions steps
# (branch logs them via [UTIL.user-owned-dir], main via
# [ENTRYPOINT.user-permissions] — expected diff #7), and the processes running
# with the new ids in live mode. python-nginx adds the gunicorn/gosu path to
# the same check (worker programs run as www-data = 10000).

images=nginx python-nginx
modes=static live

http-probe=/
