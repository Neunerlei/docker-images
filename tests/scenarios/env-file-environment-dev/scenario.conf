# Scenario: env-file-environment-dev — ENVIRONMENT=dev set in a custom env
# file now really applies (security-relevant behavior change of the
# environment pipeline reordering, docs/migration/2026-11-17-environment-pipeline.md).
#
# Before: the ENVIRONMENT normalization ran before the env files loaded, so a
# .env value was ignored by every derivation — APP_ENV stayed prod, APP_DEBUG
# stayed 0, .dev. markers never matched. Now the second derive pass
# normalizes it and re-derives the whole family:
#   - python-nginx: APP_ENV=dev, FLASK_ENV=development, APP_DEBUG=1;
#   - node-nginx: NODE_ENV=development;
#   - php-nginx: APP_ENV=dev, APP_DEBUG=1;
#   - a .dev.-marked custom snippet is selected (rendered after the pipeline);
#   - a .dev.-marked .env.sh file is selected too — the .env.sh pass is
#     marker-filtered with the values AFTER the .env pass (documented caveat
#     #3: plain .env files are filtered with the container-environment
#     values, so the normalization lands one pass later for them).

images=python-nginx node-nginx php-nginx
modes=static live

http-probe=/
