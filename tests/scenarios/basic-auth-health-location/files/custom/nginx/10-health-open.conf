# Server-level custom snippet with a NESTED auth_basic opt-out for the health
# location. The indented "off" switches auth off ONLY inside this location —
# it must not take ownership of the server authentication (020-nginx.sh
# ownership rule: only an enabled auth_basic anywhere, or an "off" at column
# 0, suppresses the generated directives).
location /health {
    auth_basic off;
}
