# ---- /etc/supervisor/supervisord.conf ----
; supervisor config file

[unix_http_server]
file=/var/run/supervisor.sock   ; (the path to the socket file)
chmod=0700                       ; sockef file mode (default 0700)

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid ; (supervisord pidfile;default supervisord.pid)
; ('AUTO' child log dir, default $TEMP). /run is used because it is writable on
; read-only filesystems (pidfile and socket live there anyway) — all services
; log to /dev/stdout|stderr, this is only for supervisor's internal tempfiles.
childlogdir=/run

; the below section must remain in the config file for RPC
; (supervisorctl/web interface) to work, additional interfaces may be
; added by defining them in separate rpcinterface: sections
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; use a unix:// URL  for a unix socket

; The [include] section can just contain the "files" setting.  This
; setting can list multiple files (separated by whitespace or
; newlines).  It can also contain wildcards.  The filenames are
; interpreted as relative to this file.  Included files *cannot*
; include files themselves.

[include]
files = /etc/supervisor/conf.d/*.conf
# ---- /etc/supervisor/conf.d/crash-on-fatal.eventlistener.conf ----
; Brings the whole container down as soon as ANY supervised program enters the
; FATAL state (exhausted its start retries — Supervisor has given up on it).
; The orchestrator then restarts the container clean, instead of it lingering
; with a permanently dead process that nothing notices (e.g. a crashed worker).
;
; Applies to every image and every mode: a process Supervisor has given up on
; is never something you want to keep a container alive for.
;
; NOTE: an eventlistener talks to supervisord over its stdout, so — unlike the
; service programs — we must NOT redirect stdout to a log file here; only the
; script's stderr is logged. See bin/supervisor-crash-on-fatal for the details.
[eventlistener:crash-on-fatal]
command=/container/bin/supervisor-crash-on-fatal
events=PROCESS_STATE_FATAL
; Start before the service programs so it is already listening when the first
; of them could reach FATAL.
priority=1
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# ---- /etc/supervisor/conf.d/gunicorn.service.mode-web.conf ----
[program:gunicorn]
command=/opt/venv/bin/gunicorn -c /etc/gunicorn.conf.py server:app
directory=/var/www/html
user=www-data
# Supervisor's `user=` only switches the uid — the environment (and its HOME=/root)
# is inherited from the root supervisord. Give the workers a writable HOME.
# Custom programs that use `user=www-data` should set the same environment line.
environment=HOME="/container/work/www-data-home"
# Wait for the full graceful shutdown window before SIGKILL. Supervisor's
# default of 10s is shorter than gunicorn's graceful_timeout, which would cut
# graceful shutdowns short. Docker/Kubernetes cap this via their grace periods.
stopwaitsecs=40
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# ---- /etc/supervisor/conf.d/nginx.service.feat-nginx.conf ----
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
