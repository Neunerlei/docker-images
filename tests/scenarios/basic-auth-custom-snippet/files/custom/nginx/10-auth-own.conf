# Server-level snippet with its own auth_basic — takes ownership of the
# server authentication (020-nginx.sh ownership rule). Rendered with ${VAR}
# substitution like every custom snippet, so NGINX_BASIC_AUTH_FILE resolves to
# the generated (still-written) password file at render time.
auth_basic "Custom Snippet Realm";
auth_basic_user_file ${NGINX_BASIC_AUTH_FILE};
