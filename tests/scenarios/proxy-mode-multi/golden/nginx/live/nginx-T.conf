# configuration file /etc/nginx/snippets/proxy.d/api.conf:
# Custom per-service snippet named exactly "<key>.conf" — the LEGACY naming
# convention (docs/nginx.md 1.2: "Snippets named exactly api.conf (without a
# purpose part) keep working for backward compatibility"). This scenario
# exists to prove the include glob change (branch: "<key>.*conf", main:
# "<key>*.conf") did not break it: the file body must appear inside the
# /api location in nginx -T on BOTH builds.
add_header X-Nl-Test-Snippet "api.conf included" always;

# configuration file /etc/nginx/snippets/proxy.d/api_v2.auth.conf:
# basic auth is not configured

# configuration file /etc/nginx/snippets/proxy.d/api_v2.prefix.conf:
# Dotted (recommended) naming for the api_v2 service. "api" and "api_v2" share
# a prefix — the dot after the key is the key boundary, so this file must be
# included ONLY in the /api_v2 location (the main-branch glob difference is
# exactly about this class of file).
add_header X-Nl-Test-Snippet "api_v2.prefix.conf included" always;

# configuration file /etc/nginx/snippets/proxy.d/frontend.auth.conf:
