error_page 400 401 403 404 500 502 503 504 @error_handler;

location @error_handler {
    internal;
    # Keep the error pages reachable when basic auth is enabled on the server,
    # so failed logins still get the custom error page instead of a bare 401
    auth_basic off;
    root ${NGINX_ERROR_ROOT};
    try_files /${status}.${error_file_ext} /${status}.html /500.html =500;
}
