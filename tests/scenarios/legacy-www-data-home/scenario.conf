# Scenario: legacy-www-data-home — §3.2 "www-data-home-directory": dotfiles
# baked/mounted under /var/www (the OLD www-data home) must stay readable.
#
# Two dot-entries are mounted into /var/www: .npmrc and .ssh/config (the
# documented examples). On the branch, the boot bridges every dot-entry of
# /var/www into the new www-data home as a SYMLINK, with a deprecation warning
# per entry (legacy_bridge_var_www_dotfiles) — intended differences: the
# warning lines on stderr and the symlinks (with their targets) in
# ownership.txt. On main the files are simply in place (the home was
# /var/www).
#
# The "readable via ~" half lives in legacy-www-data-home-tilde; this
# scenario pins the filesystem surface (static) and the boot behavior (live).

images=nginx
modes=static live

# Legacy-layer coverage: www-data home directory (dotfile bridge)
legacy-layer=2026-11-12-www-data-home-directory.sh

http-probe=/
