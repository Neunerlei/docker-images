# Custom per-service snippet named exactly "<key>.conf" — the LEGACY naming
# convention (docs/nginx.md 1.2: "Snippets named exactly api.conf (without a
# purpose part) keep working for backward compatibility"). This scenario
# exists to prove the include glob change (branch: "<key>.*conf", main:
# "<key>*.conf") did not break it: the file body must appear inside the
# /api location in nginx -T on BOTH builds.
add_header X-Nl-Test-Snippet "api.conf included" always;
