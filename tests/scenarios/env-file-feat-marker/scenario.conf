# Scenario: env-file-feat-marker — marker-filtered env files still load after
# the environment pipeline reordering (feat-* markers in particular).
#
# The env-file loading moved from step 017 into the orchestrator (step 015,
# util.d/load-custom-env-files.sh); the feat-supervisor marker must keep
# applying — which also pins the ORDER inside the orchestrator: the feature
# registry is populated (image_env_features) BEFORE the env files are
# marker-filtered. A supervisor-feature env file loads on every image (all
# images register the supervisor feature).

images=nginx
modes=static live

http-probe=/
