# Scenario: basic-auth-malformed — a malformed NGINX_BASIC_AUTH value aborts
# the boot (docs/nginx.md: "A malformed value ... aborts the container startup
# with an error message — a typo can never silently disable the protection").
#
# STATIC ONLY (modes below): the boot exits 1 in step 020 before any command
# could run, so the capture is the boot log + exit code. The value has no
# separating space, which is the documented malformed case ("a missing
# password"). The credential is synthetic like in every auth scenario.
#
# Expected relation to main: IDENTICAL — main validates the credential format
# with the same util.d/basic-auth.sh check and aborts with the same message;
# the branch only hardened the hash handling AROUND that check (self-verified
# hashing). Any difference in exit code or message here is a finding.

images=nginx
modes=static

http-probe=/
