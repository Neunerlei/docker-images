# Scenario: env-sh-upload-size — values from a DYNAMIC *.env.sh file reach
# the derived variables too (third derive pass of the environment pipeline,
# docs/migration/2026-11-17-environment-pipeline.md).
#
# .env.sh files load after the static pass; a third derive pass follows, so
# even a runtime-lookups file feeding an input variable changes what the
# framework derives from it. Here a .env.sh exports MAX_UPLOAD_SIZE=300M and
# the rendered body size follows — the old pipeline computed it exactly once,
# before any env file was even considered.

# php-nginx renders client_max_body_size in its web-mode root location (the
# plain nginx image renders it in proxy mode only — see env-file-upload-size).
# The .env.sh pass feeds the same derivation the .env pass does.

images=php-nginx
modes=static live

http-probe=/
