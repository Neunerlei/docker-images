# Scenario: env-file-serve-root — an env-file NGINX_SERVE_ROOT gets its
# ownership fixed by step 070 (environment pipeline reordering,
# docs/migration/2026-11-17-environment-pipeline.md).
#
# The static user_owned_directories_registry entries used to be evaluated in
# entrypoint.sh BEFORE the env files loaded, so a custom serve root was never
# chowned (and the DEFAULT was). The registry is now prepended in step 070,
# after the pipeline — the entry from the .env counts. The directory does not
# exist in the image: step 070 creates it (ensure_user_owned_dir), which is
# itself part of the contract. Ownership is the observable, asserted live;
# the ownership.txt golden section records the same.

images=nginx
modes=static live

http-probe=/
