# Scenario: legacy-017-override — a downstream step.d/017-custom-env.sh
# replaces BOTH custom env file loads (legacy.d/2026-11-17-environment-pipeline.sh).
#
# The override is the old 017 body verbatim (self-contained loaders + the two
# for_each passes). Through the layer it runs in place of the static *.env
# load, and the orchestrator's own .env/.env.sh loads are skipped — so each
# env file loads EXACTLY once (if the orchestrator double-loaded, the
# "[ENTRYPOINT.custom-env] Loading:" line would appear twice) and with the
# deprecation warning.

images=nginx
modes=static live

# Build-time scenario: the derived image (Dockerfile) is captured/booted.
dockerfile=Dockerfile

# Legacy-layer coverage: the 017-custom-env override path.
legacy-layer=2026-11-17-environment-pipeline.sh

http-probe=/
