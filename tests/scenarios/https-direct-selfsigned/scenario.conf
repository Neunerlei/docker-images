# Scenario: https-direct-selfsigned — DOCKER_PROJECT_PROTOCOL=https with no
# certificates mounted (docs/common.md, "HTTP vs. HTTPS" + "SSL Certificates").
#
# Direct HTTPS termination: DOCKER_SERVICE_PROTOCOL defaults to the project
# protocol, so nginx listens on 443 and redirects 80 -> 301 https. With no
# cert.pem/key.pem in /container/custom/certs, the entrypoint generates a
# SELF-SIGNED pair per boot with a warning (step.d/020-nginx.sh
# _process_ssl_cert_templates) — the fallback path this scenario exists for.
# The random certificate material (key/PEM bodies, serials, and therefore the
# work-data checksums of cert.pem/key.pem) is normalized in lib/normalize.sed.
#
# Live: GET / must answer 301 with a Location: https://... header — that
# redirect IS the observable; the TLS endpoint itself is exercised by the
# boot-time `nginx -T` config test inside the capture.

images=nginx php-nginx
modes=static live

http-probe=/
