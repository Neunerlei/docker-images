; Brings the whole container down as soon as ANY supervised program enters the
; FATAL state (exhausted its start retries — Supervisor has given up on it).
; The orchestrator then restarts the container clean, instead of it lingering
; with a permanently dead process that nothing notices (e.g. a crashed worker).
;
; Applies to every image and every mode: a process Supervisor has given up on
; is never something you want to keep a container alive for.
;
; NOTE: an eventlistener talks to supervisord over its stdout, so — unlike the
; service programs — we must NOT redirect stdout to a log file here; only the
; script's stderr is logged. See bin/supervisor-crash-on-fatal for the details.
[eventlistener:crash-on-fatal]
command=${CONTAINER_BIN_DIR}/supervisor-crash-on-fatal
events=PROCESS_STATE_FATAL
; Start before the service programs so it is already listening when the first
; of them could reach FATAL.
priority=1
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
