# Scenario: legacy-build-mode-run-env — what a LATER `RUN` step sees after the
# legacy no-command build-mode run (§3.2 "build-mode-marker-and-variables").
#
# Mechanism: the scenario image build redirects the legacy build-mode run's
# output into the work directory (survives the boot like build-step-marker in
# legacy-build-mode-boot), and a separate `RUN env > /out` records the
# environment of the next build step. At boot (STATIC capture,
# command-mode=container) the container command is `cat /out` plus the saved
# build log — so one capture holds:
#   - the boot log (image bootable, exit 0),
#   - /out: the RUN-step environment (main: base env only — the old build-mode
#     end deleted the container-vars.sh snapshot after `export -p`; branch: the
#     full container-variable snapshot incl. NODE_ENV, the fix documented in
#     the migration guide — intended difference),
#   - build-log.txt: the branch's deprecation warning + staging-sync lines vs
#     main's "exporting variables for the next command" line ("warning
#     present" observable of §3.2).
#
# node-nginx: build mode requires an image whose 015-image-vars step respects
# CONTAINER_MODE=build — the nginx image overrides the mode by design, so the
# build-mode scenarios run on node-nginx (see legacy-build-mode-boot).

images=node-nginx
modes=static

# The scenario Dockerfile (legacy build-mode run with redirected log + later
# `RUN env > /out`) is built ON TOP of the image under test (plan §2.3).
dockerfile=Dockerfile

command-mode=container
command=/bin/cat /out /container/work/build-log.txt

# Legacy-layer coverage: build mode marker and variables (deprecated no-command build mode)
legacy-layer=2026-11-12-build-mode-marker-and-variables.sh

http-probe=/
