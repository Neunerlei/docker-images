# Scenario: legacy-mount-abort — §3.2 "migrate-to-centralized-container-dir":
# the pre-2026-02 mount paths abort the boot with the migration instructions.
#
# Two legacy paths are mounted read-only (files/ dirs): /etc/ssl/certs and
# /usr/bin/container/custom — both must be DETECTED and listed in the abort
# message. STATIC ONLY (modes below): the boot exits 1 before anything runs.
#
# Expected relations to main (§3.2):
#   - exit 1 with the same message on both sides — EXCEPT the migration-guide
#     URL line: main still links the undated guide name, the branch links the
#     dated file (the undated path is a stub since the rename — intended);
#   - the branch aborts EARLIER (the check moved from step.d/010 into a direct
#     entrypoint call that runs before any state changes), so fewer log lines
#     precede the error (intended — expected diff #9).

images=nginx
modes=static

# Legacy-layer coverage: this scenario exercises the centralized-container-dir
# migration guard (legacy.d/2026-02-05-migrate-to-centralized-container-dir.sh).
# The mapping check in tests/run.sh unit requires every legacy.d file to be
# referenced by at least one scenario.
legacy-layer=2026-02-05-migrate-to-centralized-container-dir.sh

http-probe=/
