# Scenario: legacy-015-override-wins — a downstream step.d/015-image-vars.sh
# override (a modified copy of the old php step) keeps working through the
# legacy layer (legacy.d/2026-11-17-environment-pipeline.sh, expires
# 2027-11-17; docs/migration/2026-11-17-environment-pipeline.md).
#
# The override is a realistic downstream modification of the OLD php 015:
# a different PHP_MEMORY_LIMIT and a forced worker mode. Through the layer it
# runs exactly where 015 used to run — BEFORE the base image's own
# image_env_features/defaults — so:
#   - a deprecation warning names the file and the migration guide;
#   - the override's mode decision wins (worker), the base feature/mode
#     logic skips;
#   - the override's exports count as user-set: PHP_MEMORY_LIMIT stays 256M,
#     the base default (1024M) does not override it;
#   - nothing runs twice: the override's marker line appears exactly once
#     (the step loop SKIPS the file via legacy_is_absorbed_step; only the
#     orchestrator runs it).

images=php-nginx
modes=static live

# Build-time scenario: the derived image (Dockerfile) is captured/booted.
dockerfile=Dockerfile

# Legacy-layer coverage: the 015-image-vars override path.
legacy-layer=2026-11-17-environment-pipeline.sh

# Worker mode: no web server.
wait-http=false
