# configuration file /etc/nginx/snippets/resolver.nginx.conf:
# Name servers used by Nginx to resolve dynamic upstream names (a variable in
# proxy_pass, "server ... resolve", ...). Those are resolved on every request —
# Nginx never reads /etc/resolv.conf for them on its own.
#
# The default is detected from /etc/resolv.conf when the container boots:
#   Docker (user-defined networks) -> 127.0.0.11 (the embedded Docker DNS)
#   Kubernetes                     -> the cluster DNS
#   Podman / host networking       -> the runtime or host resolvers
# Override with NGINX_RESOLVER (space-separated list for multiple servers).
#
# NOTE: Nginx's resolver does not apply the "search" / "ndots" options from
# resolv.conf. In Kubernetes, use fully qualified service names
# (service.namespace.svc.cluster.local) for variable-based upstreams.
resolver <NL-TEST-RESOLVER> valid=30s;
resolver_timeout 5s;

# configuration file /etc/nginx/snippets/root.nginx.conf:
client_max_body_size 100M;



# This block is for the api-svc.invalid service
location /api {
    set $upstream http://api-svc.invalid:80;
    proxy_pass $upstream;

    

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Original-URI $request_uri;

    # Only rendered when GENERATED basic auth protects this location (global
    # or per-proxy): the client's Authorization header authenticated against
    # THIS server and must not be forwarded to the upstream. A custom snippet
    # managing the auth renders this empty (the snippet decides), and the
    # image's own app runtime never sees a proxy_set_header at all. See
    # _render_proxy_location_for_key in the proxy step for the condition.
    

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Allow per-location custom snippets. The dot after the key is the key boundary —
    # without it, keys sharing a prefix (e.g. "api" and "api_v2") would include each
    # other's snippets — and the "conf" ending keeps unrelated files (e.g. a
    # "rag.configuration.txt") out. Snippets named exactly "<key>.conf" keep working.
    # The generated basic auth snippet for this service (<key>.auth.conf, see
    # _configure_proxy_basic_auth) is picked up here as well.
    include /etc/nginx/snippets/proxy.d/api.*conf;
}

