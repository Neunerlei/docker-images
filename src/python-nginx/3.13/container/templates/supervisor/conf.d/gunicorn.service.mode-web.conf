[program:gunicorn]
command=/opt/venv/bin/gunicorn -c /etc/gunicorn.conf.py ${PYTHON_APP_MODULE}
directory=/var/www/html
user=www-data
# Supervisor's `user=` only switches the uid — the environment (and its HOME=/root)
# is inherited from the root supervisord. Give the workers a writable HOME.
# Custom programs that use `user=www-data` should set the same environment line.
environment=HOME="${CONTAINER_WWW_DATA_HOME_DIR}"
# Wait for the full graceful shutdown window before SIGKILL. Supervisor's
# default of 10s is shorter than gunicorn's graceful_timeout, which would cut
# graceful shutdowns short. Docker/Kubernetes cap this via their grace periods.
stopwaitsecs=${GUNICORN_STOP_WAIT_SECS}
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
