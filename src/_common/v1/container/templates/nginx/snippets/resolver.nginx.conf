# Name servers used by Nginx to resolve dynamic upstream names (a variable in
# proxy_pass, "server ... resolve", ...). Those are resolved on every request —
# Nginx never reads /etc/resolv.conf for them on its own.
#
# The default is detected from /etc/resolv.conf when the container boots:
#   Docker (user-defined networks) -> 127.0.0.11 (the embedded Docker DNS)
#   Kubernetes                     -> the cluster DNS
#   Podman / host networking       -> the runtime or host resolvers
# Override with NGINX_RESOLVER (space-separated list for multiple servers).
#
# NOTE: Nginx's resolver does not apply the "search" / "ndots" options from
# resolv.conf. In Kubernetes, use fully qualified service names
# (service.namespace.svc.cluster.local) for variable-based upstreams.
resolver ${NGINX_RESOLVER} valid=${NGINX_RESOLVER_VALID_TIMEOUT};
resolver_timeout ${NGINX_RESOLVER_TIMEOUT};
