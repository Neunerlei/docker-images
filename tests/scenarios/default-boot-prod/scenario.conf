# Scenario: default-boot-prod — plain boot in production mode (the default).
#
# The production twin of default-boot-dev: no env file at all — the entrypoint
# defaults to ENVIRONMENT=production, no custom-dir scaffolding (step 005 is
# dev-only), git safe.directory step skipped. Together with default-boot-dev
# this pins both branches of the environment switch on every image (plan §5).
#
# The runtime images boot their baked default apps (php-nginx public/index.php,
# node-nginx server.js, python-nginx server.py), so the live capture exercises
# the full web stack: nginx + the runtime supervisor program, including the
# §6 process-env HOME facts for gunicorn (python-nginx) and the gosu-launched
# node server.

images=nginx php-nginx node-nginx python-nginx
modes=static live

http-probe=/
