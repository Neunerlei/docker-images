# Scenario: proxy-mode-strict-abort — the strict mode of the 2026-11-16
# proxy snippet legacy layer.
#
# docs/migration/2026-11-16-proxy-snippet-include-pattern.md, "Opting Into
# the New Behavior Early": LEGACY_20261116_FORCE_EXPLICIT_SNIPPET_NAME=true
# disables the legacy include bridge and makes the boot FAIL (exit 1) for
# every file matching the old "<key>*.conf" glob that the current
# "<key>.<name>.conf" pattern does not include — the guarantee that a
# configuration renders identically before and after the layer expires
# (2027-11-16), and the way to get the prefix-collision fix immediately.
#
# The mounted proxy snippets cover both sides of the check for the api key:
#   api-cors.conf   — legacy name (old glob only) -> the boot aborts with an
#                     Error naming this file, before any config is written.
#   api.cache.conf  — current dotted name -> must NOT appear in the error.
#
# Static mode only: an aborting boot has no live surface to probe; the
# exit-code section (1) plus the boot log (stdout/stderr with the Error) IS
# the observable.

# Legacy-layer coverage (both directions checked by the unit tier): the
# strict mode of 2026-11-16-proxy-snippet-include-pattern.sh. The default
# bridging mode of the same layer is covered by proxy-mode-multi.
legacy-layer=2026-11-16-proxy-snippet-include-pattern.sh

images=nginx
modes=static
