# Scenario: legacy-015-adds-exports — a downstream 015-image-vars.sh that
# only ADDS exports keeps the base logic running
# (legacy.d/2026-11-17-environment-pipeline.sh).
#
# The override sets no mode and no features; it only exports an extra
# variable. The base image_env_features() still decides web mode (the mode
# is empty when the override runs), the base defaults still apply, and the
# addition survives every derive pass (never touched: user-set). This is the
# second documented override shape — the opposite of
# legacy-015-override-wins.

images=node-nginx
modes=static live

# Build-time scenario: the derived image (Dockerfile) is captured/booted.
dockerfile=Dockerfile

# Legacy-layer coverage: the 015-image-vars override path.
legacy-layer=2026-11-17-environment-pipeline.sh
