# Scenario: resolver-explicit — NGINX_RESOLVER set explicitly, overriding the
# auto-detection (docs/common.md: "Override the detected servers with
# NGINX_RESOLVER (space-separated list for multiple servers)").
#
# The explicit LIST (two servers) exercises the render path with multiple
# entries. Note on normalization: the lib/normalize.sed resolver rules
# normalize the NGINX_RESOLVER VARIABLE by context (they cannot distinguish a
# detected from an explicit value), and since multi-address values became a
# real case (multi-nameserver detection) the directive LIST is normalized as
# a whole as well — what stays fully visible in nginx-T.conf is the
# STRUCTURE: that the directive rendered at all, and the knob overrides
# ("resolver <NL-TEST-RESOLVER> valid=17s;" + "resolver_timeout 9s;").
# 8.8.8.8 is never queried: nothing in this scenario resolves a dynamic
# upstream at runtime.

images=nginx
modes=static live

http-probe=/
