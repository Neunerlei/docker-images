# Scenario: legacy-exact-command-sh-c — §3.2 case 3: a PROPERLY passed
# three-argument command `sh -c 'echo "$X"'`.
#
# This is the case the argv fix is ABOUT: on main the entrypoint joined the
# arguments into one string and re-split it, so the -c payload lost its
# quoting — `sh -c echo "$X"` ran bare `echo` (empty output, exit 0): the
# documented "silent no-op". The branch execs the exact argv, so the payload
# keeps its quotes and prints the value of X (provided via the env file).
#
# Expected relation: INTENDED difference — main prints an empty line, the
# branch prints "sh-c-argv-preserved" (docs/migration/2026-11-12-exact-
# command-arguments.md).

images=nginx
modes=static

command-mode=container
command=sh -c 'echo "$X"'

# Legacy-layer coverage: exact-command-arguments (single-string fallback)
legacy-layer=2026-11-12-exact-command-arguments.sh

http-probe=/
