# Scenario: basic-auth-per-proxy — global basic auth PLUS per-proxy auth on
# one service (docs/nginx.md, "Protecting a single proxied service").
#
# The documented relation: a service with its own PROXY_<KEY>_BASIC_AUTH
# REPLACES the global authentication for that location (its users and realm
# apply, the global users do not), while every other location keeps the global
# auth. Two proxies make both sides observable in one capture:
#   /        -> 401 realm "Global Realm"   (global auth, no per-proxy config)
#   /api/    -> 401 realm "API Area"       (per-proxy override)
# Password files: default.htpasswd + proxy.api.htpasswd in the work-dir auth
# directory (branch path; main used /etc/nginx/basic-auth — expected diff #5).

images=nginx
modes=static live

http-probe=/
http-probe=/api/
