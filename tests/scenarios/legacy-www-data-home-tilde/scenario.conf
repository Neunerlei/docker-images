# Scenario: legacy-www-data-home-tilde — §3.2 "www-data-home-directory",
# readability half: the bridged dotfiles must be readable by www-data VIA ~.
#
# command-mode=container: the container command is
# `gosu www-data sh -c 'cat ~/.npmrc && cat ~/.ssh/config'` — the exact
# runtime path (gosu derives HOME from the passwd entry; the shell expands ~
# from it). On main ~ is /var/www (plain files); on the branch ~ is the new
# home (bridge symlinks pointing back at /var/www).
#
# Expected relation (two effects in one capture):
#   - branch: the payload survives (exact argv), both file contents print —
#     the files ARE readable via ~ (the §3.2 property under test);
#   - main: prints NOTHING for the same command — the -c payload is destroyed
#     by main's join-and-resplit (bare `cat` reads empty stdin, exit 0). That
#     difference is the argv fix (#15), not a readability change; the boot
#     logs still differ by the bridge warnings (#18).

images=nginx
modes=static

command-mode=container
command=gosu www-data sh -c 'cat ~/.npmrc && cat ~/.ssh/config'

# Legacy-layer coverage: www-data home directory (dotfile bridge)
legacy-layer=2026-11-12-www-data-home-directory.sh

http-probe=/
