# Scenario: env-file-upload-size-proxy — the nginx image's half of the
# env-file upload-size coverage (see env-file-upload-size for the runtime
# images). The nginx image renders client_max_body_size only in PROXY mode
# (root.proxy.nginx.conf), so this scenario switches it via a PROXY_*_CONTAINER
# variable — deliberately passed through the CONTAINER environment (docker
# --env-file), because mode and features cannot come from custom env files
# (they are decided before those load). MAX_UPLOAD_SIZE comes from the .env.

images=nginx
modes=static live

http-probe=/
