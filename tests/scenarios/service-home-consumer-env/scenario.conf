# Scenario: service-home-consumer-env — a consumer-style `ENV HOME` set on the
# container (the §6 scenario): which processes follow it?
#
# docs/proposals plan §6: everything started via `gosu www-data` (workers,
# node web command) and php-fpm workers take HOME from the passwd entry — a
# consumer's ENV HOME never reached them, on main either. The ONE exception
# was [program:gunicorn]: supervisor's user= only switches the uid, so on main
# gunicorn inherited supervisord's HOME — here /home/nl-test-consumer. The
# branch pins gunicorn via environment=HOME="${CONTAINER_WWW_DATA_HOME_DIR}".
#
# Direct measurement, not inference: /proc environ is unreadable for
# uid-changed processes (supervisor setuid / gosu), so the python-nginx side
# mounts a tiny WSGI module (files/wsgi-home-probe.py) served BY gunicorn
# itself (PYTHON_APP_MODULE) and reports its own HOME through an X-Nl-Test-Home
# response header — the same channel as the php-fpm-home scenario. The
# process-env section additionally records the readable root programs
# (crash-on-fatal shows the supervisord HOME that main's gunicorn inherits),
# and the exec-shell-env section measures the gosu-launched CLI home.
#
# Observables (live): gunicorn header HOME on main vs branch — expected-diff
# PENDING ACCEPTANCE (#21, §6/§7); node-nginx is the control (gosu path, passwd
# home on both); php-nginx records the php-fpm marker. Static captures are
# unaffected in content: HOME is deliberately excluded from the container-vars
# snapshot (util.d/get-all-vars.sh).

images=python-nginx node-nginx php-nginx
modes=static live

http-probe=/
