# Scenario: init-build-env-refuses-boot — `RUN init-build-env` in a build
# stage, then booting the result (docs/common.md, "Build Mode").
#
# The supported build-mode invocation writes the build-mode marker into the
# image layer; a boot of such an image must REFUSE with the explanatory error
# and exit 1 BEFORE the entrypoint changes any state (entrypoint.sh marker
# check). STATIC ONLY (modes below): the boot aborts, nothing can run.
#
# Parity note: main has no init-build-env (the utility is new on this branch),
# so the scenario image build FAILS on main by design — recorded in the
# report as an expected build failure, not a regression.

images=php-nginx node-nginx
modes=static

# The scenario Dockerfile (RUN init-build-env) is built ON TOP of the image
# under test before the capture (plan §2.3).
dockerfile=Dockerfile

http-probe=/
