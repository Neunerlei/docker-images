# Scenario: proxy-mode-multi — proxy mode with several proxied services,
# including custom per-service snippets mounted via files/ + docker-args.
#
# docs/nginx.md, "Proxy Mode In-Depth" + "1.2 Per-Service Snippets": any
# PROXY_<KEY>_CONTAINER variable turns the image into a reverse proxy; a
# snippet in custom/nginx/proxy/ matching "<key>.<name>.conf" is included
# into that service's location block. Two naming cases are pinned here:
#
#   api.conf            — named exactly "<key>.conf": matches BOTH the old
#                         "<key>*.conf" and the current "<key>.*conf" glob,
#                         so the 2026-11-16 legacy bridge ignores it and the
#                         normal render includes it (no warning).
#   api_v2.prefix.conf  — correct dotted name for api_v2, but it ALSO matches
#                         the old "api*.conf" glob. The legacy bridge
#                         restores the pre-migration behavior including its
#                         flaws: it is rendered a second time as
#                         "api.legacy.api_v2.prefix.conf" and therefore
#                         appears in BOTH the /api and /api_v2 locations,
#                         with one boot-time WARNING for the api key. The
#                         overlap only disappears when the layer expires
#                         (2027-11-16) or in strict mode
#                         (LEGACY_20261116_FORCE_EXPLICIT_SNIPPET_NAME=true —
#                         see the proxy-mode-strict-abort scenario).
#
# The upstream hosts are deliberately nonexistent: proxy_pass uses a $variable
# (dynamic upstream), so the boot succeeds without DNS and a request fails
# 502 at request time — deterministic on both sides. "api" and "api_v2" share
# a key prefix on purpose: that shared prefix is what the bridged file rides
# on.

# Legacy-layer coverage (both directions checked by the unit tier): this
# scenario exercises the bridge's default mode end to end — the leaked
# include is part of the rendered config (nginx-T.conf) and the WARNING is
# part of the boot log (stderr/logs sections). The strict mode of the same
# layer is covered by proxy-mode-strict-abort.
legacy-layer=2026-11-16-proxy-snippet-include-pattern.sh

images=nginx
modes=static live

# / -> frontend location (no snippet, no auth), /api -> api location (the
# exact-name snippet + the bridged leak must appear in the rendered config),
# /api_v2/ -> api_v2 location (the snippet's normal home)
http-probe=/
http-probe=/api/
http-probe=/api_v2/
