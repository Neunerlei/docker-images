# Scenario: read-only-filesystem — the documented read-only deployment
# (docs/common.md, "Running on a Read-Only Filesystem") on all four images.
#
# docker-args applies the documented set: --read-only plus tmpfs for the
# runtime directories (/run, /tmp, /var/lib/nginx, /var/log/nginx) AND an
# anonymous tmpfs at /container/work — the documented writable mount for the
# rendered configuration and the www-data home (docs/common.md documents
# `-v my-work:/container/work` as part of the same set; an anonymous tmpfs is
# the suite-friendly equivalent: it starts empty like tmpfs/emptyDir in the
# docs). This is the branch's headline feature (b453da7 "handle read-only
# mounts and rework work data bootstrap"): an EMPTY work mount must be seeded
# from the build-time staging area and boot cleanly.
#
# Expected relation to main: main has the old clean-state mechanism — with an
# empty work dir it snapshots on first boot, so a read-only boot also starts
# there, but the childlogdir and work-data layout differences of expected
# diffs #1/#3 show up. Any UNEXPECTED abort is a finding.

images=nginx php-nginx node-nginx python-nginx
modes=static live

http-probe=/
