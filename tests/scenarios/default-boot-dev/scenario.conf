# Scenario: default-boot-dev — plain boot in development mode.
#
# The baseline scenario: no extra env beyond ENVIRONMENT=development, no
# mounts, no command override. Development mode makes the entrypoint scaffold
# the /container/custom skeleton (step 005), so this scenario exercises a
# slightly larger filesystem surface than a production boot.
#
# Runs on every image (plan §5: default boot dev/prod on all four) — the
# runtime images additionally record their service surface here (gunicorn /
# php-fpm / node supervisor programs and the exec-shell HOME section), which
# is the §6 HOME verification baseline in development mode.

# Images this scenario applies to (space separated)
images=nginx php-nginx node-nginx python-nginx

# Capture modes (static: entrypoint steps then exec the probe; live: normal
# boot + docker exec probe)
modes=static live

# Extra HTTP paths to request in live mode (GET / is always probed)
http-probe=/
