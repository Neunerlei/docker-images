# Scenario: basic-auth-custom-snippet — a server-level custom snippet that
# already declares its own `auth_basic` while NGINX_BASIC_AUTH is also set
# (docs/nginx.md, "Basic Authentication" ownership rule).
#
# NGINX forbids the directive twice in one context, so a custom snippet that
# declares `auth_basic` TAKES OWNERSHIP: the entrypoint skips its generated
# directives and reduces the always-present include snippet to a comment
# ("basic auth is managed by a custom server snippet"), but still writes the
# password file so the snippet can point auth_basic_user_file at it via the
# NGINX_BASIC_AUTH_FILE template variable — exactly what this snippet does.
# Live observable: 401 with the CUSTOM snippet's realm, on both builds.

images=nginx
modes=static live

http-probe=/
