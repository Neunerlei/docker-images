# Dotted (recommended) naming for the api_v2 service. "api" and "api_v2"
# share a prefix, and this file ALSO matches the OLD "api*.conf" glob — the
# 2026-11-16 legacy bridge restores that pre-migration behavior: the file is
# rendered a second time as "api.legacy.api_v2.prefix.conf" and its body must
# appear in BOTH the /api and /api_v2 locations in nginx -T, with one boot
# WARNING for the api key. After the layer expires (or in strict mode) only
# the /api_v2 location keeps it.
add_header X-Nl-Test-Snippet "api_v2.prefix.conf included" always;
