# Scenario: legacy-no-override — no downstream step.d/015-image-vars.sh or
# 017-custom-env.sh present: the boot is clean, NO deprecation warning
# (the negative case of legacy.d/2026-11-17-environment-pipeline.sh).
#
# The base images ship neither file; nothing the layer provides may make a
# normal boot louder. This is the plain nginx default boot with the warning
# absence asserted live.

images=nginx
modes=live

http-probe=/
