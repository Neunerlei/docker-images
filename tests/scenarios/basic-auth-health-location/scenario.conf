# Scenario: basic-auth-health-location — global basic auth ON plus a custom
# server snippet that switches auth off for a nested health location
# (docs/nginx.md, "Basic Authentication" + health-check opt-outs).
#
# The snippet's `location /health { auth_basic off; }` is INDENTED — a nested
# block, NOT the include point's own context — so it must NOT take ownership:
# the generated NGINX_BASIC_AUTH directives stay rendered (the auth include is
# NOT reduced to a comment), `/` keeps answering 401 with the global realm,
# and `/health` stays open for health checks that cannot send credentials.
# This is the context-aware half of the ownership rule; the "whole snippet
# takes ownership" half is basic-auth-custom-snippet. Unit-level: the
# nested-off cases of snippet_manages_basic_auth (Tier 1).

images=nginx
modes=static live

# / -> protected by the generated global auth (401). /health -> the nested
# opt-out (200, served from the mounted file).
http-probe=/
http-probe=/health
