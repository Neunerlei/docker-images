# Scenario: php-fpm-home — the php-fpm worker HOME via the documented probe
# mechanism (plan §2.2 note: /proc/<pid>/environ is an exec-time snapshot and
# unreliable for FPM workers).
#
# A tiny PHP script (files/home-probe.php) is bind-mounted into the document
# root and requested via http-probe in live mode: it reports getenv('HOME')
# and posix_getpwuid(posix_geteuid()) through X-Nl-Test-* response headers,
# which collect_http records (see lib/probe.sh). The php-fpm program itself is
# registered in the probe's environ_unreliable_programs list and recorded with
# a marker instead of a possibly-wrong HOME.
#
# Expected relation to main: the FPM worker HOME follows the www-data passwd
# entry — /var/www on main, /container/work/www-data-home on the branch
# (expected diff #2). No consumer ENV HOME is set here: this is the
# passwd-derived baseline.

images=php-nginx
modes=static live

http-probe=/home-probe.php
http-probe=/fpm-ping
