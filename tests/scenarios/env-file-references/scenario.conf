# Scenario: env-file-references — ${VAR} references inside a custom .env
# resolve against the pass-1 values, exactly as they did before the
# environment pipeline reordering (docs/migration/2026-11-17-environment-pipeline.md,
# "Caveats").
#
# The .env sets an input (DOCKER_PROJECT_PATH) and references derived values
# in the SAME file. References expand at load time — between the first and
# the second derive pass — so every reference sees the pass-1 value
# ("/", 3000, 104857600, production). The pipeline's whole point is that this
# STAYS true: a naive "load data first" order would leave them empty. The
# corrected derivations exist one pass later: the final DOCKER_SERVICE_ABS_PATH
# is /proj-alpha (the behavior change; before the reordering it stayed "/"
# forever).
#
# The expected reference values were captured against the pre-reordering
# branch (feature/basic-auth) build before this scenario landed.

images=node-nginx
modes=static live

http-probe=/
